
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080B12">
  <title>MEGA MAN X | Meu Arcade</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080B12;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #header {
      height: 42px;
      min-height: 42px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080B12;
      z-index: 5;
    }

    #header h1 {
      margin: 0;
      color: #fff;
      font-size: 19px;
      letter-spacing: 1px;
    }

    #game {
      position: relative;
      width: 100%;
      height: calc(100dvh - 42px);
      flex: 1;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
    }

    #status {
      position: absolute;
      z-index: 4;
      top: 48px;
      left: 0;
      right: 0;
      text-align: center;
      color: #55c8ff;
      font-size: 12px;
      pointer-events: none;
    }

    @media (orientation: landscape) {
      #header {
        position: absolute;
        top: 0;
        left: 0;
        height: 34px;
        min-height: 34px;
        background: transparent;
        pointer-events: none;
      }

      #header h1 {
        font-size: 16px;
      }

      #game {
        height: 100dvh;
      }

      #status {
        top: 36px;
      }
    }
  </style>
</head>

<body>

  <header id="header">
    <h1>MEGA MAN X</h1>
  </header>

  <div id="status">Preparando seu jogo...</div>

  <div id="game"></div>

  <script>
    // IDENTIFICAÇÃO
    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_controlScheme = "snes";
    window.EJS_gameName = "Mega Man X";
    window.EJS_gameID = "mega-man-x";

    // ROM
    window.EJS_gameUrl =
      "/jogos/megaman-x/mega-man-x.smc";

    // EMULADOR
    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = true;

    // SALVAMENTO NORMAL AUTOMÁTICO
    window.EJS_fixedSaveInterval = 30000;

    // CONTROLES VIRTUAIS NO ESTILO SUPER NINTENDO
    window.EJS_VirtualGamepadSettings = [

      // DIRECIONAL À ESQUERDA
      {
        type: "dpad",
        location: "left",
        left: "50%",
        right: "50%",
        joystickInput: false,
        inputValues: [4, 5, 6, 7]
      },

      // BOTÃO Y
      {
        type: "button",
        text: "Y",
        id: "y",
        location: "right",
        left: 40,
        top: 40,
        bold: true,
        input_value: 9
      },

      // BOTÃO X
      {
        type: "button",
        text: "X",
        id: "x",
        location: "right",
        left: 40,
        top: 0,
        bold: true,
        input_value: 1
      },

      // BOTÃO B
      {
        type: "button",
        text: "B",
        id: "b",
        location: "right",
        left: 0,
        top: 80,
        bold: true,
        input_value: 8
      },

      // BOTÃO A
      {
        type: "button",
        text: "A",
        id: "a",
        location: "right",
        left: 80,
        top: 40,
        bold: true,
        input_value: 0
      },

      // SELECT PEQUENO
      {
        type: "button",
        text: "SELECT",
        id: "select",
        location: "center",
        left: -55,
        fontSize: 11,
        block: true,
        input_value: 2
      },

      // START PEQUENO
      {
        type: "button",
        text: "START",
        id: "start",
        location: "center",
        left: 5,
        fontSize: 11,
        block: true,
        input_value: 3
      }
    ];

    // TECLADO DO COMPUTADOR
    window.EJS_defaultControls = {
      0: {
        0: { value: "x", value2: "BUTTON_2" },
        1: { value: "s", value2: "BUTTON_4" },
        2: { value: "v", value2: "SELECT" },
        3: { value: "enter", value2: "START" },
        4: { value: "up arrow", value2: "DPAD_UP" },
        5: { value: "down arrow", value2: "DPAD_DOWN" },
        6: { value: "left arrow", value2: "DPAD_LEFT" },
        7: { value: "right arrow", value2: "DPAD_RIGHT" },
        8: { value: "z", value2: "BUTTON_1" },
        9: { value: "a", value2: "BUTTON_3" },
        10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
        11: { value: "e", value2: "RIGHT_TOP_SHOULDER" }
      },
      1: {},
      2: {},
      3: {}
    };

    // MENSAGENS DE CARREGAMENTO
    const status = document.getElementById("status");

    window.EJS_ready = function() {
      status.textContent = "MEGA MAN X pronto!";
    };

    // CARREGAR EMULADOR
    const loader = document.createElement("script");

    loader.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    loader.onload = function() {
      status.textContent = "Carregando MEGA MAN X...";
    };

    loader.onerror = function() {
      status.textContent =
        "Erro ao carregar. Verifique sua conexão com a internet.";
    };

    document.body.appendChild(loader);
  </script>

</body>
</html>
