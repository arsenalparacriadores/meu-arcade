
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Men X | Meu Arcade</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      padding: 16px;
      text-align: center;
      overscroll-behavior-y: contain;
    }

    h1 {
      color: #55c8ff;
      margin-bottom: 8px;
    }

    .subtitulo { color: #c5d5e5; }

    #status {
      color: #55c8ff;
      margin: 16px;
    }

    #game {
      width: 100%;
      max-width: 960px;
      height: min(72vh, 720px);
      min-height: 320px;
      margin: 20px auto;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
    }

    #game canvas { max-width: 100%; }

    .aviso {
      color: #aab8ca;
      font-size: 13px;
      margin-top: 20px;
    }

    @media (max-width: 600px) {
      body { padding: 8px; }
      h1 { font-size: 25px; }
      #game {
        height: 65vh;
        min-height: 280px;
      }
    }
  </style>
</head>

<body>
  <h1>MEGA MEN X</h1>
  <p class="subtitulo">Meu Arcade</p>

  <p id="status">Preparando seu jogo...</p>
  <div id="game"></div>

  <p class="aviso">
    O jogo é carregado automaticamente.
    Os controles de toque estarão disponíveis em dispositivos móveis.
  </p>

  <script>
    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "Mega Men X";
    window.EJS_gameID = "mega-men-x";

    window.EJS_gameUrl = "./mega-men-x.smc";

    window.EJS_fixedSaveInterval = 30000;
    window.EJS_startOnLoaded = true;
    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_ready = function() {
      document.getElementById("status").textContent =
        "Jogo pronto! Divirta-se!";
    };

    const loader = document.createElement("script");
    loader.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    loader.onerror = function() {
      document.getElementById("status").textContent =
        "Não foi possível carregar o emulador. Verifique sua conexão.";
    };

    loader.onload = function() {
      document.getElementById("status").textContent =
        "Carregando o jogo...";
    };

    document.body.appendChild(loader);
  </script>
</body>
</html>
