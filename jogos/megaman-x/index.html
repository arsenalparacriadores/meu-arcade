
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mega Man X | Meu Arcade</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { color: #55c8ff; }
    #game {
      width: 100%;
      max-width: 960px;
      margin: 20px auto;
    }
    #game canvas {
      max-width: 100%;
    }
    input, button {
      padding: 12px;
      margin: 10px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>MEGA MAN X</h1>
  <p>Meu Arcade</p>

  <p>Selecione uma ROM de Super Nintendo autorizada:</p>
  <input type="file" id="rom"
    accept=".smc,.sfc,.zip">

  <p id="status">Aguardando o jogo...</p>

  <div id="game"></div>

  <script>
    const romInput = document.getElementById("rom");
    const statusText = document.getElementById("status");

    romInput.addEventListener("change", function() {
      const file = this.files[0];

      if (!file) return;

      statusText.textContent = "Carregando o emulador...";

      window.EJS_player = "#game";
      window.EJS_core = "snes";
window.EJS_gameUrl = file;
window.EJS_startOnLoaded = true;
      window.EJS_gameID = 101;
      window.EJS_gameUrl = URL.createObjectURL(file);
      window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

      const loader = document.createElement("script");
      loader.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

      loader.onload = function() {
        statusText.textContent = "Emulador carregado!";
      };

      loader.onerror = function() {
        statusText.textContent =
          "Erro ao carregar o emulador. Tente novamente.";
      };

      document.body.appendChild(loader);
    });
  </script>

</body>
</html>
