
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080B12">
  <title>MEGA MAN X | Meu Arcade</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080B12;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #topo {
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080B12;
      color: white;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #game {
      width: 100%;
      height: calc(100dvh - 42px);
      flex: 1;
      min-height: 0;
      background: #000;
      overflow: hidden;
      position: relative;
      touch-action: none;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
    }

    @media (orientation: landscape) {
      #topo {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 34px;
        min-height: 34px;
        background: transparent;
        z-index: 2;
        pointer-events: none;
        font-size: 16px;
      }

      #game {
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <div id="topo">MEGA MAN X</div>
  <div id="game"></div>

  <script>
    // JOGO
    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "Mega Man X";
    window.EJS_gameID = 1001;
    window.EJS_gameUrl =
      "/jogos/megaman-x/mega-man-x.smc";

    // EMULADOR
    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    // O navegador pode exigir um toque para iniciar.
    // O botão inicial do próprio emulador será mantido.
    window.EJS_startOnLoaded = false;
    window.EJS_startButtonName = "JOGAR";
    window.EJS_alignStartButton = "center";

    // APARÊNCIA
    window.EJS_color = "#55c8ff";
    window.EJS_backgroundColor = "#000000";

    // SALVAMENTO AUTOMÁTICO DOS DADOS DO JOGO
    window.EJS_fixedSaveInterval = 30000;

    // CONTROLES NO FORMATO DO SUPER NINTENDO
    window.EJS_VirtualGamepadSettings = [

      // DIRECIONAL À ESQUERDA
      {
        type: "dpad",
        location: "left",
        left: "50%",
        right: "50%",
        joystickInput: false,
        inputValues: [4, 5, 6, 7]
      },

      // X - EM CIMA
      {
        type: "button",
        text: "X",
        id: "x",
        location: "right",
        left: 40,
        top: 0,
        bold: true,
        input_value: 1
      },

      // Y - À ESQUERDA
      {
        type: "button",
        text: "Y",
        id: "y",
        location: "right",
        left: 0,
        top: 40,
        bold: true,
        input_value: 9
      },

      // A - À DIREITA
      {
        type: "button",
        text: "A",
        id: "a",
        location: "right",
        left: 80,
        top: 40,
        bold: true,
        input_value: 0
      },

      // B - EMBAIXO
      {
        type: "button",
        text: "B",
        id: "b",
        location: "right",
        left: 40,
        top: 80,
        bold: true,
        input_value: 8
      },

      // SELECT - PEQUENO, NO CENTRO
      {
        type: "button",
        text: "SELECT",
        id: "select",
        location: "center",
        left: -5,
        fontSize: 12,
        block: true,
        input_value: 2
      },

      // START - PEQUENO, AO LADO DO SELECT
      {
        type: "button",
        text: "START",
        id: "start",
        location: "center",
        left: 60,
        fontSize: 12,
        block: true,
        input_value: 3
      }
    ];

    // TECLADO DO COMPUTADOR
    window.EJS_defaultControls = {
      0: {
        0: { value: "x", value2: "BUTTON_2" },
        1: { value: "s", value2: "BUTTON_4" },
        2: { value: "v", value2: "SELECT" },
        3: { value: "enter", value2: "START" },
        4: { value: "up arrow", value2: "DPAD_UP" },
        5: { value: "down arrow", value2: "DPAD_DOWN" },
        6: { value: "left arrow", value2: "DPAD_LEFT" },
        7: { value: "right arrow", value2: "DPAD_RIGHT" },
        8: { value: "z", value2: "BUTTON_1" },
        9: { value: "a", value2: "BUTTON_3" },
        10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
        11: { value: "e", value2: "RIGHT_TOP_SHOULDER" }
      },
      1: {},
      2: {},
      3: {}
    };

    // MENSAGEM DE CARREGAMENTO
    window.EJS_ready = function() {
      console.log("MEGA MAN X carregado.");
    };

    // CARREGAR EMULATORJS
    const loader = document.createElement("script");
    loader.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    loader.onerror = function() {
      document.getElementById("game").innerHTML =
        '<p style="color:white;text-align:center;padding:30px">Não foi possível carregar o emulador. Verifique sua conexão.</p>';
    };

    document.body.appendChild(loader);
  </script>

</body>
</html>
