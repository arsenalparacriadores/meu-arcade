
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080B12">
  <title>MEGA MAN X | Meu Arcade</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080B12;
      color: white;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    #topo {
      height: 42px;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080B12;
      color: white;
      font-size: 19px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    #game {
      width: 100%;
      height: calc(100dvh - 42px);
      flex: 1;
      min-height: 0;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    #game canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      touch-action: none;
    }

    @media (orientation: landscape) {
      #topo {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 34px;
        min-height: 34px;
        background: transparent;
        z-index: 2;
        pointer-events: none;
        font-size: 16px;
      }

      #game {
        height: 100dvh;
      }
    }
  </style>
</head>

<body>

  <div id="topo">MEGA MAN X</div>
  <div id="game"></div>

  <script>
    // JOGO
    window.EJS_player = "#game";
    window.EJS_core = "snes";
    window.EJS_gameName = "Mega Man X";
    window.EJS_gameID = 1001;
    window.EJS_gameUrl =
      "/meu-arcade/jogos/megaman-x/mega-man-x.smc";

    // EMULADOR
    window.EJS_pathtodata =
      "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded = false;
    window.EJS_startButtonName = "JOGAR";
    window.EJS_alignStartButton = "center";

    // APARÊNCIA
    window.EJS_color = "#55c8ff";
    window.EJS_backgroundColor = "#000000";

    // SALVAMENTO NORMAL DO JOGO
    window.EJS_fixedSaveInterval = 30000;

    // CONTROLES
    window.EJS_VirtualGamepadSettings = [
      {
        type: "dpad",
        location: "left",
        left: "50%",
        right: "50%",
        joystickInput: false,
        inputValues: [4, 5, 6, 7]
      },
      {
        type: "button",
        text: "X",
        id: "x",
        location: "right",
        left: 40,
        top: 0,
        bold: true,
        input_value: 1
      },
      {
        type: "button",
        text: "Y",
        id: "y",
        location: "right",
        left: 0,
        top: 40,
        bold: true,
        input_value: 9
      },
      {
        type: "button",
        text: "A",
        id: "a",
        location: "right",
        left: 80,
        top: 40,
        bold: true,
        input_value: 0
      },
      {
        type: "button",
        text: "B",
        id: "b",
        location: "right",
        left: 40,
        top: 80,
        bold: true,
        input_value: 8
      },
      {
        type: "button",
        text: "SELECT",
        id: "select",
        location: "center",
        left: -5,
        fontSize: 12,
        block: true,
        input_value: 2
      },
      {
        type: "button",
        text: "START",
        id: "start",
        location: "center",
        left: 60,
        fontSize: 12,
        block: true,
        input_value: 3
      }
    ];

    // TECLADO DO COMPUTADOR
    window.EJS_defaultControls = {
      0: {
        0: { value: "x", value2: "BUTTON_2" },
        1: { value: "s", value2: "BUTTON_4" },
        2: { value: "v", value2: "SELECT" },
        3: { value: "enter", value2: "START" },
        4: { value: "up arrow", value2: "DPAD_UP" },
        5: { value: "down arrow", value2: "DPAD_DOWN" },
        6: { value: "left arrow", value2: "DPAD_LEFT" },
        7: { value: "right arrow", value2: "DPAD_RIGHT" },
        8: { value: "z", value2: "BUTTON_1" },
        9: { value: "a", value2: "BUTTON_3" },
        10: { value: "q", value2: "LEFT_TOP_SHOULDER" },
        11: { value: "e", value2: "RIGHT_TOP_SHOULDER" }
      },
      1: {},
      2: {},
      3: {}
    };

    // ==========================================
    // SALVAMENTO AUTOMÁTICO DO ESTADO COMPLETO
    // ==========================================

    const SAVE_DB_NAME = "meu-arcade-saves";
    const SAVE_DB_VERSION = 1;
    const SAVE_STORE = "estados";
    const SAVE_KEY = "mega-man-x-1001";

    let saveDatabase = null;
    let gameStarted = false;
    let restoreFinished = false;
    let saveInProgress = false;

    // Abre o banco interno do navegador.
    function openSaveDatabase() {
      if (saveDatabase) {
        return Promise.resolve(saveDatabase);
      }

      return new Promise((resolve, reject) => {
        const request = indexedDB.open(
          SAVE_DB_NAME,
          SAVE_DB_VERSION
        );

        request.onupgradeneeded = function(event) {
          const db = event.target.result;

          if (!db.objectStoreNames.contains(SAVE_STORE)) {
            db.createObjectStore(SAVE_STORE);
          }
        };

        request.onsuccess = function(event) {
          saveDatabase = event.target.result;

          saveDatabase.onversionchange = function() {
            saveDatabase.close();
            saveDatabase = null;
          };

          resolve(saveDatabase);
        };

        request.onerror = function() {
          reject(request.error);
        };
      });
    }

    // Grava o estado no banco do navegador.
    async function storeGameState(buffer) {
      const db = await openSaveDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(
          SAVE_STORE,
          "readwrite"
        );

        transaction.objectStore(SAVE_STORE).put(
          buffer,
          SAVE_KEY
        );

        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }

    // Recupera o último estado salvo.
    async function readGameState() {
      const db = await openSaveDatabase();

      return new Promise((resolve, reject) => {
        const transaction = db.transaction(
          SAVE_STORE,
          "readonly"
        );

        const request = transaction
          .objectStore(SAVE_STORE)
          .get(SAVE_KEY);

        request.onsuccess = () => resolve(request.result || null);
        request.onerror = () => reject(request.error);
      });
    }

    // Salva o ponto exato em que o jogo está.
    async function saveCurrentGame() {
      if (!gameStarted || !restoreFinished || saveInProgress) {
        return;
      }

      const manager =
        window.EJS_emulator &&
        window.EJS_emulator.gameManager;

      if (!manager || typeof manager.getState !== "function") {
        return;
      }

      saveInProgress = true;

      try {
        const state = await manager.getState();

        if (!state || state.length === 0) {
          return;
        }

        const buffer = new Uint8Array(state).slice().buffer;

        await storeGameState(buffer);

        console.log("Progresso do MEGA MAN X salvo no navegador.");
      } catch (error) {
        console.error("Erro ao salvar o progresso:", error);
      } finally {
        saveInProgress = false;
      }
    }

    // Restaura o último ponto salvo quando o jogo começa.
    async function restorePreviousGame() {
      const manager =
        window.EJS_emulator &&
        window.EJS_emulator.gameManager;

      if (!manager || typeof manager.loadState !== "function") {
        restoreFinished = true;
        return;
      }

      try {
        const savedState = await readGameState();

        if (savedState) {
          manager.loadState(new Uint8Array(savedState));

          console.log("Progresso anterior restaurado.");
        } else {
          console.log("Nenhum progresso anterior encontrado.");
        }
      } catch (error) {
        console.error("Erro ao restaurar o progresso:", error);
      } finally {
        restoreFinished = true;
      }
    }

    // Chamado pelo EmulatorJS quando o jogo começa.
    window.EJS_onGameStart = function() {
      gameStarted = true;
      restoreFinished = false;

      restorePreviousGame();
    };

    // Salvamento periódico: a cada 20 segundos.
    setInterval(function() {
      saveCurrentGame();
    }, 20000);

    // Tenta salvar quando a pessoa troca de aba ou aplicativo.
    document.addEventListener("visibilitychange", function() {
      if (document.visibilityState === "hidden") {
        saveCurrentGame();
      }
    });

    // Tenta salvar quando a página é fechada.
    window.addEventListener("pagehide", function() {
      saveCurrentGame();
    });

    // MENSAGEM DE CARREGAMENTO
    window.EJS_ready = function() {
      console.log("MEGA MAN X carregado.");
    };

    // CARREGAR EMULATORJS
    const loader = document.createElement("script");

    loader.src =
      "https://cdn.emulatorjs.org/stable/data/loader.js";

    loader.onerror = function() {
      document.getElementById("game").innerHTML =
        '<p style="color:white;text-align:center;padding:30px">Não foi possível carregar o emulador. Verifique sua conexão.</p>';
    };

    document.body.appendChild(loader);
  </script>

</body>
</html>
