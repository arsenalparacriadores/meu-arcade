
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171321">
  <title>Meu Arcade</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #171321;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    .logo {
      font-size: 52px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 36px;
      margin: 0 0 12px;
    }

    p {
      color: #c5bfd3;
      line-height: 1.6;
    }

    .console {
      margin-top: 32px;
      padding: 28px;
      border: 2px solid #6953a5;
      border-radius: 24px;
      background: #231d32;
    }

    .screen {
      min-height: 180px;
      border-radius: 14px;
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
    }

    .status {
      color: #b9a1ff;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">🕹️</div>
    <h1>Meu Arcade</h1>
    <p>Sua coleção de jogos retrô, em um só lugar.</p>

    <section class="console">
      <div class="screen">👾</div>
      <p>Seu próximo jogo começa aqui.</p>
      <div class="status">ARCADE EM CONSTRUÇÃO</div>
    </section>
  </main>
</body>
</html>
